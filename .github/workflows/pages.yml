# 部署到 GitHub Pages（docs/07 第 9 节）。托管位置还没最终定（海外静态托管 / 国内 OSS + CDN），
# 所以这个工作流只能手动触发，推送代码不会自动发布：
#   1. 仓库 Settings → Pages → Build and deployment → Source 选 “GitHub Actions”
#   2. Actions 页面选“部署到 GitHub Pages”，点 Run workflow
name: 部署到 GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # 类型检查 + 打包；产物是相对路径，放在 Pages 的子路径下也能用
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
