# 部署到 GitHub Pages（docs/07 第 9 节）：推送到 main 自动发布，也可以在 Actions 页面手动运行。
# 仓库是私有的时候跳过（免费账号的私有仓库开不了 Pages）。第一次发布前：
#   仓库 Settings → Pages → Build and deployment → Source 选 “GitHub Actions”
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # 类型检查 + 打包；产物是相对路径，放在 Pages 的子路径下也能用
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
